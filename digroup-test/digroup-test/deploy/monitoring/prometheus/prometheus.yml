global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'digroup-monitor'

# Правила алертов
rule_files:
  - 'alerts.yml'

# Конфигурация сбора метрик
scrape_configs:
  # Prometheus сам себя
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - метрики системы
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # DIGroup Kernel - метрики приложения
  - job_name: 'digroup-kernel'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:6806']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Nginx метрики (если установлен nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s

