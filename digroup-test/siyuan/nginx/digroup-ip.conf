# Конфигурация Nginx для DIGroup по IP адресу (без домена, без SSL)
# Для тестирования удаленного доступа
# Скопируйте в /etc/nginx/sites-available/digroup

# Map для правильной обработки WebSocket Connection заголовка
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP сервер (без SSL, для тестирования)
server {
    listen 80;
    # Можно указать IP или оставить default_server для всех запросов
    # server_name ваш-ip-адрес;  # Например: server_name 192.168.1.100;
    # Или используйте default_server для приема всех запросов на порт 80
    
    # Логирование
    access_log /var/log/nginx/digroup-access.log;
    error_log /var/log/nginx/digroup-error.log;
    
    # Максимальный размер загружаемых файлов
    client_max_body_size 100M;
    
    # Проксирование на DIGroup kernel
    location / {
        proxy_pass http://127.0.0.1:6806;
        proxy_http_version 1.1;
        
        # Заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket поддержка (критически важно для DIGroup!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Таймауты для WebSocket (долгие соединения)
        proxy_read_timeout 86400;      # 24 часа
        proxy_send_timeout 86400;      # 24 часа
        proxy_connect_timeout 60;      # 1 минута
        
        # Отключение буферизации для WebSocket
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Размеры буферов
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Отключение кэширования для динамического контента
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Специальная обработка WebSocket endpoint
    location /ws {
        proxy_pass http://127.0.0.1:6806;
        proxy_http_version 1.1;
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket - критически важно!
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты для WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
        
        # Отключение буферизации
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Отключение кэширования
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Кэширование статических файлов (опционально)
    location /assets/ {
        proxy_pass http://127.0.0.1:6806;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}

