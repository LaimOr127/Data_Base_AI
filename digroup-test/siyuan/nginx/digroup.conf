# Конфигурация Nginx для DIGroup с поддержкой WebSocket и SSL
# Скопируйте этот файл в /etc/nginx/sites-available/digroup

# Map для правильной обработки WebSocket Connection заголовка
# Должен быть в начале файла, вне блоков server
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    server_name digroup.yourdomain.com;  # ЗАМЕНИТЕ на ваш домен
    
    # Редирект всех HTTP запросов на HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name digroup.yourdomain.com;  # ЗАМЕНИТЕ на ваш домен
    
    # SSL сертификаты (будут настроены автоматически Certbot)
    # После запуска certbot эти строки будут добавлены автоматически
    # ssl_certificate /etc/letsencrypt/live/digroup.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/digroup.yourdomain.com/privkey.pem;
    
    # SSL настройки (рекомендуемые для безопасности)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Логирование
    access_log /var/log/nginx/digroup-access.log;
    error_log /var/log/nginx/digroup-error.log;
    
    # Максимальный размер загружаемых файлов
    client_max_body_size 100M;
    
    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Проксирование на DIGroup kernel
    location / {
        proxy_pass http://127.0.0.1:6806;
        proxy_http_version 1.1;
        
        # Заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket поддержка (критически важно для DIGroup!)
        # Используем map, определенный выше
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Таймауты для WebSocket (долгие соединения)
        proxy_read_timeout 86400;      # 24 часа
        proxy_send_timeout 86400;      # 24 часа
        proxy_connect_timeout 60;      # 1 минута
        
        # Отключение буферизации для WebSocket
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Размеры буферов
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Отключение кэширования для динамического контента
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Специальная обработка WebSocket endpoint
    location /ws {
        proxy_pass http://127.0.0.1:6806;
        proxy_http_version 1.1;
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket - критически важно!
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты для WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
        
        # Отключение буферизации
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Отключение кэширования
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Кэширование статических файлов (опционально)
    location /assets/ {
        proxy_pass http://127.0.0.1:6806;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}

