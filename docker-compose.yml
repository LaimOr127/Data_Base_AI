services:
  digroup:
    build:
      context: ./siyuan
      dockerfile: Dockerfile
    container_name: digroup
    restart: unless-stopped
    ports:
      # По умолчанию только localhost для безопасности (через Nginx)
      # Для прямого доступа по IP установите HOST_IP=0.0.0.0 в .env
      - "${HOST_IP:-127.0.0.1}:${PORT:-6806}:6806"
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SIYUAN_ACCESS_AUTH_CODE=${ACCESS_AUTH_CODE:-b226ba0f30a134fe9245792118bca202}
      - SIYUAN_WORKSPACE_PATH=/opt/siyuan/workspace
      - OLLAMA_API_BASE=http://ollama:11434
    volumes:
      - ./workspace:/opt/siyuan/workspace
      - ./data:/opt/siyuan/data
    command: [
      "/opt/siyuan/kernel",
      "--workspace=/opt/siyuan/workspace",
      "--port=6806"
    ]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6806/api/system/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - ollama
    networks:
      - digroup-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - digroup-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Для работы через пути (без субдоменов) раскомментируйте:
      # - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
      # - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - digroup-network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - digroup-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - digroup-network
    # Ollama будет доступен из других контейнеров через сеть digroup-network
    # URL для доступа: http://ollama:11434

networks:
  digroup-network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ollama_data:
    driver: local
