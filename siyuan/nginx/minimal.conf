# Минимальная рабочая конфигурация Nginx для DIGroup
# Используйте эту конфигурацию, если стандартная не работает

# Map для WebSocket (ОБЯЗАТЕЛЬНО в начале файла!)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    # server_name _;  # Принимает все запросы
    
    # Логирование
    access_log /var/log/nginx/digroup-access.log;
    error_log /var/log/nginx/digroup-error.log;
    
    # Максимальный размер файлов
    client_max_body_size 100M;
    
    # Основной location - проксирование всего
    location / {
        proxy_pass http://127.0.0.1:6806;
        proxy_http_version 1.1;
        
        # Базовые заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket (критически важно!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Таймауты
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 60;
        
        # Отключение буферизации
        proxy_buffering off;
    }
}

