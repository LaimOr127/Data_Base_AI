# Конфигурация rate limiting для Nginx
# Добавьте в блок server в nginx конфигурации

# Зона для ограничения запросов
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

# Зона для ограничения соединений
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    # ... остальная конфигурация ...
    
    # Ограничение для API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        
        proxy_pass http://127.0.0.1:6806;
        # ... остальные proxy настройки ...
    }
    
    # Ограничение для WebSocket
    location /ws {
        limit_req zone=ws_limit burst=10 nodelay;
        limit_conn conn_limit 5;
        
        proxy_pass http://127.0.0.1:6806;
        # ... остальные proxy настройки ...
    }
    
    # Блокировка подозрительных запросов
    if ($request_uri ~* "(\.\./|\.\.|/etc/passwd|/bin/bash)") {
        return 403;
    }
    
    # Защита от SQL инъекций (если есть параметры)
    if ($args ~* "(union|select|insert|delete|drop|update)") {
        return 403;
    }
}

