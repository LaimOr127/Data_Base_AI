groups:
  - name: digroup_alerts
    interval: 30s
    rules:
      # Алерт: Kernel недоступен
      - alert: DIGroupKernelDown
        expr: up{job="digroup-kernel"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DIGroup Kernel недоступен"
          description: "Kernel не отвечает более 1 минуты"

      # Алерт: Высокое использование CPU
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование CPU"
          description: "CPU использование превышает 80%"

      # Алерт: Высокое использование памяти
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование памяти"
          description: "Использование памяти превышает 85%"

      # Алерт: Мало места на диске
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Мало места на диске"
          description: "Свободного места на диске менее 15%"

      # Алерт: Много активных WebSocket соединений
      - alert: HighWebSocketConnections
        expr: digroup_websocket_connections > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Много активных WebSocket соединений"
          description: "Активных WebSocket соединений: {{ $value }}"

